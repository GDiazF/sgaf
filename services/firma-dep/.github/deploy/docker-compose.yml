services:
  firma-dep:
    image: placeholder
    container_name: firma-dep
    user: nestjs
    ports:
      - "${PORT:-4010}:${PORT:-4010}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-4010}/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
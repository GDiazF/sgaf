services:
  db:
    image: postgres:16-alpine
    container_name: sgaf_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sgaf}
      POSTGRES_USER: ${DB_USER:-sgaf_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./docker/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sgaf_user} -d ${DB_NAME:-sgaf}"]
      interval: 10s
      timeout: 5s
      retries: 5

  firma-dep:
    build:
      context: ./services/firma-dep
      dockerfile: Dockerfile
    container_name: sgaf_firma_dep
    restart: unless-stopped
    # Un solo .env en la raíz (mismo que backend). No hace falta services/firma-dep/.env en el servidor.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4010
      API_ALLOW_LOCALHOST: "false"
      SWAGGER_ENABLED: "false"
      API_SECURITY_ENABLED: "true"
    volumes:
      - ./services/firma-dep/logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4010/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
      - "4010"

  backend:
    build: 
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: sgaf_backend_prod
    restart: unless-stopped
    env_file: .env
    environment:
      FIRMA_DEP_URL: http://firma-dep:4010/api/v1
      FIRMA_DEP_CLIENT_ID: ${FIRMA_DEP_CLIENT_ID:-sgaf-backend}
      FIRMA_DEP_API_KEY: ${FIRMA_DEP_API_KEY:-dev-key}
    volumes:
      - ./backend:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      firma-dep:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: sgaf_frontend_prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/app/media:ro
      - ./staticfiles:/app/staticfiles:ro
    depends_on:
      - backend

volumes:
  postgres_data:
